name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux-ubuntu16:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pack in Ubuntu 16.04 (docker)
        run: docker run --rm -v "$GITHUB_WORKSPACE:/work" -w /work ubuntu:16.04 bash tools/ci_pack_ubuntu16.sh

      - name: Fix dist permissions
        run: sudo chown -R "$(id -u):$(id -g)" dist

      - name: Smoke test frozen executable
        run: |
          chmod +x dist/jinja-build
          rm -rf .release-smoke
          ./dist/jinja-build \
            -t examples/02-filters \
            -i examples/02-filters/config.yaml \
            -o .release-smoke/02-filters
          grep -q "title_filter: title:hello" .release-smoke/02-filters/demo

      - uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: |
            dist/jinja-build
            dist/jinja-build-*-linux.tar.gz

  publish-release:
    needs: build-linux-ubuntu16
    if: startsWith(github.ref, 'refs/tags/') && needs.build-linux-ubuntu16.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: linux-release
          path: release-assets

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: false
          fail_on_unmatched_files: true
          files: release-assets/**
