name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux-ubuntu16:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pack in Ubuntu 16.04 (docker)
        run: docker run --rm -v "$GITHUB_WORKSPACE:/work" -w /work ubuntu:16.04 bash tools/ci_pack_ubuntu16.sh

      - name: Fix dist permissions
        run: sudo chown -R "$(id -u):$(id -g)" dist

      - name: Smoke test frozen executable
        run: |
          chmod +x dist/jinja-build
          rm -rf .release-smoke
          ./dist/jinja-build \
            -t examples/02-filters \
            -i examples/02-filters/config.yaml \
            -o .release-smoke/02-filters
          grep -q "title_filter: title:hello" .release-smoke/02-filters/demo
          ./dist/jinja-build \
            -t examples/08-third-party-rich \
            -i examples/08-third-party-rich/config.yaml \
            -o .release-smoke/08-third-party-rich
          grep -q "models.py" .release-smoke/08-third-party-rich/out

      - uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: |
            dist/jinja-build
            dist/jinja-build-*-linux.tar.gz

  publish-release:
    needs: build-linux-ubuntu16
    if: always() && needs.build-linux-ubuntu16.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release tag
        id: release
        shell: bash
        run: |
          version="$(python3 - <<'PY'
          import re
          from pathlib import Path

          in_project = False
          for line in Path("pyproject.toml").read_text(encoding="utf-8").splitlines():
              stripped = line.strip()
              if stripped == "[project]":
                  in_project = True
                  continue
              if stripped.startswith("[") and stripped.endswith("]"):
                  in_project = False
              if in_project:
                  match = re.match(r'version\s*=\s*["\']([^"\']+)["\']', stripped)
                  if match:
                      print(match.group(1))
                      raise SystemExit(0)
          raise SystemExit("pyproject.toml missing [project].version")
          PY
          )"
          test -n "$version"
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          name: linux-release
          path: release-assets

      - name: Move release tag
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -fa "${{ steps.release.outputs.tag }}" -m "Release ${{ steps.release.outputs.tag }}"
          git push origin "${{ steps.release.outputs.tag }}" --force

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          generate_release_notes: false
          fail_on_unmatched_files: true
          overwrite_files: true
          files: release-assets/**
